name: python-unit-tests
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

jobs:
  python-unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
      - name: Setup SSH Keys and known_hosts
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_ACTION_SSH_PRIV_KEY }}
      - name: Setup git
        run: |
          git config --global user.email "github_actions@example.com"
          git config --global user.name "Github Actions"
      - name: Test SSH access to dnas_stats
        run: |
          ssh -T git@github.com 2>&1 | grep -q "successfully authenticated" && echo "SSH access verified" || echo "SSH access failed"
      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dnas/requirements.txt
          sudo apt-get install -y whois shellcheck
      - name: Run the tox tests
        working-directory: /home/runner/work/dfz_name_and_shame/dfz_name_and_shame/
        run: |
          tox
        env:
          SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}
          SSH_AGENT_PID: ${{ env.SSH_AGENT_PID }}
